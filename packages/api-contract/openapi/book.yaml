openapi: 3.0.3
info:
  title: API каталога книг
  version: 1.0.0
  description: |
    REST API для управления каталогом книг и авторов.
    Поддерживает роли: гость (просмотр) и пользователь (CRUD).
    Аутентификация через JWT Access Token и opaque Refresh Token в HttpOnly Cookie.
servers:
  - url: /api/v1
    description: Основной сервер API

paths:
  /auth/register:
    post:
      operationId: postAuthRegister
      summary: Регистрация нового пользователя
      description: Создаёт аккаунт, открывает сессию и устанавливает Access и Refresh Cookie.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Пользователь успешно зарегистрирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '409':
          description: Пользователь с таким логином или email уже существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                success: false
                errors:
                  - field: email
                    message: Пользователь с таким email уже зарегистрирован
        '422':
          description: Ошибка валидации данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                success: false
                errors:
                  - field: password
                    message: Пароль должен содержать минимум 8 символов

  /auth/login:
    post:
      operationId: postAuthLogin
      summary: Авторизация пользователя
      description: Открывает новую сессию и устанавливает Access и Refresh Cookie.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Успешная авторизация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '401':
          description: Неверные учётные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: Ошибка валидации данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /auth/refresh:
    post:
      operationId: postAuthRefresh
      summary: Обновление сессии
      description: Атомарно ротирует Refresh Token и выдаёт новый Access Token.
      tags:
        - Authentication
      security:
        - refreshCookie: []
      responses:
        '200':
          description: Сессия обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '401':
          description: Refresh Token отсутствует, недействителен, отозван или истёк
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /auth/session:
    get:
      operationId: getAuthSession
      summary: Текущая сессия
      tags:
        - Authentication
      security:
        - accessCookie: []
      responses:
        '200':
          description: Текущий пользователь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '401':
          description: Access Token отсутствует или недействителен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /auth/logout:
    post:
      operationId: postAuthLogout
      summary: Завершение текущей сессии
      description: Отзывает текущее семейство Refresh Token и очищает Cookie. Операция идемпотентна.
      tags:
        - Authentication
      security:
        - refreshCookie: []
        - {}
      responses:
        '204':
          description: Сессия завершена

  /books:
    get:
      operationId: getBooks
      summary: Список книг
      description: Доступно гостям и пользователям. Поддерживает пагинацию, фильтрацию и поиск.
      tags:
        - Books
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: author_id
          in: query
          schema:
            type: integer
            minimum: 1
        - name: year
          in: query
          schema:
            type: integer
            minimum: 1
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Список книг
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookListResponse'
    post:
      operationId: createBook
      summary: Создание книги
      description: Доступно только авторизованным пользователям.
      tags:
        - Books
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookCreateForm'
      responses:
        '201':
          description: Книга создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '401':
          description: Неавторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '413':
          description: Размер файла обложки превышает допустимый предел
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '415':
          description: Неподдерживаемый формат файла обложки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: Ошибка валидации полей или файла обложки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /books/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      operationId: getBooksId
      summary: Получить книгу по ID
      tags:
        - Books
      responses:
        '200':
          description: Информация о книге
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '404':
          description: Книга не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
    patch:
      operationId: updateBook
      summary: Частичное обновление книги
      tags:
        - Books
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookPatchForm'
      responses:
        '200':
          description: Книга обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '401':
          description: Неавторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Книга не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '413':
          description: Размер файла обложки превышает допустимый предел
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '415':
          description: Неподдерживаемый формат файла обложки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: Ошибка валидации полей или файла обложки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
    delete:
      operationId: deleteBook
      summary: Удаление книги
      tags:
        - Books
      security:
        - accessCookie: []
      responses:
        '204':
          description: Книга удалена
        '401':
          description: Неавторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Книга не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /authors:
    get:
      operationId: getAuthors
      summary: Список авторов
      description: Доступно гостям и пользователям.
      tags:
        - Authors
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Список авторов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorListResponse'
    post:
      operationId: createAuthor
      summary: Создание автора
      tags:
        - Authors
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorCreateInput'
      responses:
        '201':
          description: Автор создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorResponse'
        '401':
          description: Неавторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: Ошибки валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /authors/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      operationId: getAuthorsId
      summary: Информация об авторе и его книгах
      tags:
        - Authors
      responses:
        '200':
          description: Данные автора
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorResponse'
        '404':
          description: Автор не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
    patch:
      operationId: updateAuthor
      summary: Частичное обновление автора
      tags:
        - Authors
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorPatchInput'
      responses:
        '200':
          description: Автор обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorResponse'
        '401':
          description: Неавторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Автор не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: Ошибки валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
    delete:
      operationId: deleteAuthor
      summary: Удаление автора
      tags:
        - Authors
      security:
        - accessCookie: []
      responses:
        '204':
          description: Автор удалён
        '401':
          description: Неавторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Автор не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /reports/top-authors:
    get:
      operationId: getReportsTopAuthors
      summary: ТОП-10 авторов по количеству книг за год
      description: Публичный отчёт. Доступен гостям и пользователям.
      tags:
        - Reports
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
          description: Год выпуска книг
      responses:
        '200':
          description: Список авторов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopAuthorsResponse'
        '400':
          description: Параметр year не указан или неверен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

components:
  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: access_token
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token

  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          description: Уникальное имя пользователя (логин)
          minLength: 3
          maxLength: 30
          example: johndoe
        email:
          type: string
          format: email
          description: Электронная почта пользователя
          example: john.doe@example.com
        password:
          type: string
          format: password
          description: Пароль пользователя
          minLength: 8
          maxLength: 100
          example: StrongP@ssw0rd!

    AuthUser:
      type: object
      additionalProperties: false
      required:
        - id
        - username
        - email
        - role
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'

    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          format: password
          minLength: 1

    AuthSessionResponse:
      type: object
      additionalProperties: false
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum: [true]
          example: true
        data:
          type: object
          additionalProperties: false
          required:
            - user
            - access_expires_at
          properties:
            user:
              $ref: '#/components/schemas/AuthUser'
            access_expires_at:
              type: string
              format: date-time

    UserRole:
      type: string
      enum:
        - user
      example: user

    Book:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - year
        - description
        - isbn
        - cover_url
        - authors
      properties:
        id:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 1
        year:
          type: integer
          minimum: 1
        description:
          type: string
        isbn:
          type: string
        cover_url:
          type: string
          format: uri
          nullable: true
        authors:
          type: array
          items:
            $ref: '#/components/schemas/AuthorShort'

    AuthorShort:
      type: object
      additionalProperties: false
      required:
        - id
        - full_name
      properties:
        id:
          type: integer
          minimum: 1
        full_name:
          type: string
          minLength: 1

    Author:
      type: object
      additionalProperties: false
      required:
        - id
        - full_name
        - books
      properties:
        id:
          type: integer
          minimum: 1
        full_name:
          type: string
          minLength: 1
        books:
          type: array
          items:
            $ref: '#/components/schemas/BookShort'

    BookShort:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - year
      properties:
        id:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 1
        year:
          type: integer
          minimum: 1

    BookCreateForm:
      type: object
      additionalProperties: false
      required:
        - title
        - year
        - author_ids
      properties:
        title:
          type: string
          minLength: 1
        year:
          type: integer
          minimum: 1
        description:
          type: string
        isbn:
          type: string
        author_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: integer
            minimum: 1
        cover:
          type: string
          format: binary
          description: Файл изображения обложки

    BookPatchForm:
      type: object
      additionalProperties: false
      minProperties: 1
      not:
        description: Нельзя одновременно загрузить новую обложку и удалить существующую
        required:
          - cover
          - remove_cover
        properties:
          remove_cover:
            enum: [true]
      properties:
        title:
          type: string
          minLength: 1
        year:
          type: integer
          minimum: 1
        description:
          type: string
        isbn:
          type: string
        author_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: integer
            minimum: 1
        cover:
          type: string
          format: binary
          description: Новый файл изображения обложки
        remove_cover:
          type: boolean
          description: Удалить существующую обложку

    AuthorCreateInput:
      type: object
      additionalProperties: false
      required:
        - full_name
      properties:
        full_name:
          type: string
          minLength: 1

    AuthorPatchInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        full_name:
          type: string
          minLength: 1

    BookResponse:
      type: object
      additionalProperties: false
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum: [true]
          example: true
        data:
          $ref: '#/components/schemas/Book'

    AuthorResponse:
      type: object
      additionalProperties: false
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum: [true]
          example: true
        data:
          $ref: '#/components/schemas/Author'

    BookListResponse:
      type: object
      additionalProperties: false
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum: [true]
          example: true
        data:
          type: object
          additionalProperties: false
          required:
            - items
            - pagination
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Book'
            pagination:
              $ref: '#/components/schemas/Pagination'

    AuthorListResponse:
      type: object
      additionalProperties: false
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum: [true]
          example: true
        data:
          type: object
          additionalProperties: false
          required:
            - items
            - pagination
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AuthorShort'
            pagination:
              $ref: '#/components/schemas/Pagination'

    TopAuthorsResponse:
      type: object
      additionalProperties: false
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum: [true]
          example: true
        data:
          type: object
          additionalProperties: false
          required:
            - year
            - items
          properties:
            year:
              type: integer
              minimum: 1
            items:
              type: array
              items:
                $ref: '#/components/schemas/TopAuthor'

    TopAuthor:
      type: object
      additionalProperties: false
      required:
        - rank
        - author_id
        - full_name
        - books_count
      properties:
        rank:
          type: integer
          minimum: 1
        author_id:
          type: integer
          minimum: 1
        full_name:
          type: string
          minLength: 1
        books_count:
          type: integer
          minimum: 0

    Pagination:
      type: object
      additionalProperties: false
      required:
        - total
        - page
        - per_page
        - total_pages
      properties:
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
        total_pages:
          type: integer
          minimum: 0

    ApiErrorResponse:
      type: object
      additionalProperties: false
      required:
        - success
        - errors
      properties:
        success:
          type: boolean
          enum: [false]
          example: false
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorItem'

    ErrorItem:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        field:
          type: string
        message:
          type: string
          minLength: 1
