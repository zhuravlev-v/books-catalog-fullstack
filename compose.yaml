services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:${DB_PORT}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        API_PORT: ${API_PORT}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: ${API_PORT}
      API_BASE_PATH: ${API_BASE_PATH}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - '${API_PORT}'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_BASE_PATH: ${API_BASE_PATH}
        VITE_API_MOCKING: ${VITE_API_MOCKING}
        VITE_MOCK_JWT_SECRET: ${VITE_MOCK_JWT_SECRET}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_PORT: ${API_PORT}
      API_BASE_PATH: ${API_BASE_PATH}
    ports:
      - '${WEB_PORT}:80'

volumes:
  postgres_data:
