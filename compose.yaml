services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:${DB_PORT}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: ${MINIO_IMAGE}
    command: server --console-address ':9001' --license /opt/minio/minio.license /data
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
      - ${MINIO_LICENSE_PATH}:/opt/minio/minio.license:ro
    ports:
      - '127.0.0.1:${MINIO_API_PORT}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT}:9001'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: ${MINIO_IMAGE}
    restart: 'no'
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${S3_BUCKET}" &&
        mc anonymous set download "local/$${S3_BUCKET}" &&
        while IFS= read -r line; do
          case "$$line" in
            *__S3_BUCKET__*)
              prefix=$${line%%__S3_BUCKET__*};
              suffix=$${line#*__S3_BUCKET__};
              printf '%s%s%s\n' "$$prefix" "$${S3_BUCKET}" "$$suffix";
              ;;
            *)
              printf '%s\n' "$$line";
              ;;
          esac;
        done < /etc/minio/books-api-policy.json > /tmp/books-api-policy.json &&
        mc admin user add local "$${S3_ACCESS_KEY_ID}" "$${S3_SECRET_ACCESS_KEY}" &&
        mc admin policy create local books-api /tmp/books-api-policy.json &&
        mc admin policy attach local books-api --user "$${S3_ACCESS_KEY_ID}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - ./infrastructure/minio/books-api-policy.json:/etc/minio/books-api-policy.json:ro
    depends_on:
      minio:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        API_PORT: ${API_PORT}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: ${API_PORT}
      API_BASE_PATH: ${API_BASE_PATH}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      JWT_ACCESS_TOKEN_TTL_SECONDS: ${JWT_ACCESS_TOKEN_TTL_SECONDS}
      AUTH_REFRESH_TOKEN_TTL_SECONDS: ${AUTH_REFRESH_TOKEN_TTL_SECONDS}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE}
      S3_MAX_FILE_SIZE: ${S3_MAX_FILE_SIZE}
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    expose:
      - '${API_PORT}'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_BASE_PATH: ${API_BASE_PATH}
        VITE_API_MOCKING: ${VITE_API_MOCKING}
        VITE_MOCK_JWT_SECRET: ${VITE_MOCK_JWT_SECRET}
    restart: unless-stopped
    depends_on:
      - api
      - minio
    environment:
      API_PORT: ${API_PORT}
      API_BASE_PATH: ${API_BASE_PATH}
      S3_BUCKET: ${S3_BUCKET}
    ports:
      - '${WEB_PORT}:80'

volumes:
  postgres_data:
  minio_data:
